[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inet-client"
version = "0.3.0"
description = "Python client, MCP server and LangChain tools for the INET web research engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
langchain = ["langchain-core>=0.3"]

[project.scripts]
inet-mcp = "inet_client.mcp_server:main"

[project.urls]
Homepage = "https://github.com/JGSnapp/inet"

[tool.hatch.build.targets.wheel]
packages = ["inet_client"]
